<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Wave Riders — Boat Racing</title>
<meta name="description" content="Race jet skis, speedboats, sailboats and pontoons across a living ocean. Drive through glowing portals into calm lagoons, rolling swell and thunderstorms. Made for kids, built on the ABYSSAL ocean." />
<meta name="theme-color" content="#0a7fbf" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a7fbf'/%3E%3Cpath d='M4 21c4-4 8-4 12 0s8 4 12 0v7H4z' fill='%2364d8ff'/%3E%3Cpath d='M9 18l3-8h9l4 8z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; height: 100%; background: #0a7fbf; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          background: linear-gradient(180deg, #37b9ff 0%, #0a7fbf 60%, #045a8d 100%); color: #fff; font-family: 'Nunito', 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
          z-index: 50; transition: opacity 0.5s ease; text-align: center; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: clamp(36px, 9vw, 84px); letter-spacing: 0.04em; font-weight: 900; text-shadow: 0 4px 0 #045a8d, 0 8px 24px rgba(0,0,0,0.35); }
  #bootbar { width: min(60vw, 420px); height: 18px; border-radius: 12px; background: rgba(255,255,255,0.25); overflow: hidden; box-shadow: inset 0 2px 6px rgba(0,0,0,0.25); }
  #bootbar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ffd84d, #ff9f1a); border-radius: 12px; transition: width 0.3s ease; }
  #bootmsg { font-size: 18px; font-weight: 700; opacity: 0.9; text-transform: capitalize; }
  #booterr { max-width: 560px; font-size: 16px; line-height: 1.4; }
  #booterr pre { white-space: pre-wrap; font-size: 12px; text-align: left; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
  #booterr button { font: inherit; font-weight: 800; padding: 12px 22px; border-radius: 14px; border: 0; background: #ffd84d; color: #05324f; cursor: pointer; }
  .boot-boat { font-size: 64px; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg);} 50% { transform: translateY(-10px) rotate(3deg);} }
</style>
</head>
<body>
<canvas id="gl" aria-label="Wave Riders boat racing game"></canvas>
<div id="hud" aria-live="polite"></div>
<div id="boot" role="status">
  <div class="boot-boat">🚤</div>
  <h1>WAVE RIDERS</h1>
  <div id="bootbar"><i></i></div>
  <div id="bootmsg">Filling the ocean</div>
  <div id="booterr"></div>
</div>
<script type="module" src="/src/game/main.js"></script>
</body>
</html>
